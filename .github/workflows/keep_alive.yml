name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (Maximum allowed)
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: |
          # Ping the DIRECT Streamlit URL to force wake-up
          # (Netlify is just a wrapper, pinging it doesn't wake the backend)
          curl -I https://budget2026.streamlit.app/
          
          # Optional: Ping Netlify too just in case
          curl -I https://budgetsoldado2026.netlify.app/
