name: Keep Alive

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: |
          # Ping the Netlify entry point
          curl -I https://minera-budget-2026.netlify.app/
          
          # If you know the direct Streamlit Cloud URL (e.g. https://your-app.streamlit.app), 
          # uncomment and add it below for a more direct "wake up":
          # curl -I https://tu-app.streamlit.app/
