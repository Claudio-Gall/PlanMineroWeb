name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (Maximum allowed)
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping App
        run: |
          # SIMULATE REAL BROWSER VISIT (Full GET request, User-Agent)
          # HEAD requests (-I) are sometimes ignored by sleep-management systems.
          curl -L --retry 3 --max-time 10 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36" https://budget2026.streamlit.app/
          
          # Optional: Ping Netlify too (just to keep route active)
          curl -L --retry 3 --max-time 10 -A "Mozilla/5.0" https://budgetsoldado2026.netlify.app/
